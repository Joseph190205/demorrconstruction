<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contact - RR Construction</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="navbar">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/contact}">Contact</a>
        <a th:href="@{/admin/login}">Admin Login</a>
    </div>

    <div class="content">
        <h2>Contact Us</h2>
        <p th:if="${success}"
   th:text="${success}"
   style="color:green; font-weight:bold; text-align:center;">
</p>

        <form th:action="@{/saveContact}" th:object="${contact}" method="post">

            <label>Name</label><br>
            <input type="text" th:field="*{name}" placeholder="Enter your name" required>
            <br><br>

            <label>Email</label><br>
            <input type="email" th:field="*{email}" placeholder="Enter your email" required>
            <br><br>

            <label>Message</label><br>
            <textarea th:field="*{message}" placeholder="Enter your message" required></textarea>
            <br><br>

            <input type="submit" value="Send Message">

        </form>
    </div>

    <footer>
        <hr>
        <p style="text-align:center;">
            © 2026 RR Construction | All Rights Reserved
        </p>
    </footer>

</body>
</html>
