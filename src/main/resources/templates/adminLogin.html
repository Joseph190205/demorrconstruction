<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<title>Admin Login</title>
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="stylesheet" th:href="@{/css/style.css}">

</head>


<body>



<div class="navbar">


<div class="logo">
RR Construction
</div>


<div>

<a th:href="@{/}">
Home
</a>


<a th:href="@{/contact}">
Contact
</a>


</div>


</div>




<div class="login-box">


<h2>
Admin Login
</h2>



<form th:action="@{/admin/login}" method="post">


<label>
Username
</label>


<input type="text"
name="username"
placeholder="Enter username"
required>



<label>
Password
</label>


<input type="password"
name="password"
placeholder="Enter password"
required>



<button>
Login
</button>



</form>



<p class="error"
th:text="${error}">
</p>


</div>


</body>

</html>
