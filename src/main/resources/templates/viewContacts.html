<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>RR Construction | Admin Dashboard</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>


<body>


<!-- ADMIN NAVBAR -->

<div class="admin-navbar">


<div class="logo">
RR Construction Admin
</div>


<div>

<a th:href="@{/}">
Website
</a>


<a th:href="@{/admin/logout}">
Logout
</a>


</div>


</div>





<!-- DASHBOARD CONTENT -->


<div class="dashboard">


<h1>
Welcome Admin 👋
</h1>


<div class="stats-card">


<h3>
Total Customer Enquiries
</h3>


<h1 th:text="${#lists.size(contacts)}">
0
</h1>


</div>





<div class="table-box">


<h2>
Customer Messages
</h2>



<table>


<tr>

<th>ID</th>

<th>Customer</th>

<th>Email</th>

<th>Message</th>

<th>Status</th>

<th>Actions</th>

</tr>



<tr th:each="contact : ${contacts}">


<td th:text="${contact.id}">
</td>



<td>

<div class="customer-name"
th:text="${contact.name}">
</div>

</td>




<td th:text="${contact.email}">
</td>





<td class="msg"
th:text="${contact.message}">
</td>






<td>


<span class="pending-status"
th:if="${contact.reply == null or #strings.isEmpty(contact.reply)}">

Pending Reply

</span>



<span class="done-status"
th:if="${contact.reply != null and !#strings.isEmpty(contact.reply)}">

✓ Replied

</span>


</td>






<td>


<a class="reply-button"

th:if="${contact.reply == null or #strings.isEmpty(contact.reply)}"

th:href="@{/reply/{id}(id=${contact.id})}">

Reply

</a>



<a class="delete-button"

th:href="@{/delete/{id}(id=${contact.id})}">

Delete

</a>



</td>



</tr>


</table>


</div>


</div>




<footer>

© 2026 RR Construction | Admin Panel

</footer>


</body>

</html>
